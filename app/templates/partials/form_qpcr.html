{# app/templates/partials/form_aspcr.html #}

<div class="form-block">
  <div class="section-title">AS-PCR Target</div>

  <div class="form-grid">
    <div class="form-row">
      <label for="chrom">Chrom</label>
      <input id="chrom" name="chrom" type="text" placeholder="e.g. chr7" required>
    </div>

    <div class="form-row">
      <label for="start">Start</label>
      <input id="start" name="start" type="number" required>
    </div>

    <div class="form-row">
      <label for="end">End</label>
      <input id="end" name="end" type="number" required>
    </div>

    <div class="form-row">
      <label for="variant">Variant (AS)</label>
      <input id="variant" name="variant" type="text" placeholder="e.g. chr7:... A>G" required>
      <div class="help-text">AS-PCR용 변이/allele 정보를 입력</div>
    </div>
  </div>

  <div class="sub-section">
    <div class="sub-section-title">Excel Upload (Optional)</div>
    <div class="form-row">
      <label for="excel_file">Excel File</label>
      <input id="excel_file" name="excel_file" type="file" accept=".xlsx,.xls,.csv">
    </div>
  </div>
</div>
