{# app/templates/partials/form_manual.html #}
<div class="form-block">
  <div class="section-title">Manual QPCR Design</div>

  <div class="form-grid">
    <div class="form-row">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="e.g. Sample1" required>
    </div>

    <div class="form-row">
      <label for="template_sequence">Template Sequence</label>
		<textarea
			id="template_sequence"
			name="template_sequence"
			placeholder="Paste template sequence here (ACGT, newline allowed)"
			rows="8"
			style="width:100%; font-family: monospace; resize: vertical;"
			required>
		</textarea>
    </div>

    <div class="form-row">
      <label>Target Start Index (1-based)</label>
      <input type="number" name="target_start_index" required />
	</div>

    <div class="form-row">
      <label>Target End Index (1-based)</label>
      <input type="number" name="target_end_index" required />
    </div>

    
  <div class="sub-section">
    <div class="sub-section-title">Excel Upload (Optional)</div>
    <div class="form-row">
      <label for="excel_file">Excel File</label>
      <input id="excel_file" name="excel_file" type="file" accept=".xlsx,.xls,.csv">
    </div>
  </div>
</div>
</div>
