{# app/templates/partials/mode_toggle.html #}

{% set current_design_mode = current_design_mode if current_design_mode is defined else 'single' %}

<div class="section-block">
  <div class="section-header">
    <p class="section-desc">
      단일 영역(Single) 또는 다중 영역(Multi, Excel 업로드) 중 하나를 선택하세요.
    </p>
  </div>

  <div class="banner-toggle">
    <button
      type="button"
      class="toggle-btn mode-btn {% if current_design_mode == 'single' %}active{% endif %}"
      data-mode="single"
    >
      Single
    </button>

    <button
      type="button"
      class="toggle-btn mode-btn {% if current_design_mode == 'multi' %}active{% endif %}"
      data-mode="multi"
    >
      Multi
    </button>
  </div>
</div>
