{# app/templates/partials/form_multi.html #}

<div class="section-block">
    <div class="section-header">
        <h2 class="section-title">다중 영역 Excel 업로드</h2>
        <p class="section-desc">
            엑셀 파일을 업로드하여 여러 genomic region에 대해 일괄 프라이머 설계를 수행합니다.
        </p>
    </div>

    <div class="primer-form">
        <div class="form-row">
            <label for="file">Excel 파일 업로드 (.xlsx / .xls)</label>
            <input type="file" name="file" id="file" accept=".xlsx,.xls">
        </div>

        <div class="help-text">
            · 필수 컬럼: <strong>chrom, start, end</strong><br>
            · 선택 컬럼: name, sequence<br>
            · Reference가 hg19/hg38이면 chrom/start/end 기준으로 자동으로 서열을 불러옵니다.
        </div>
    </div>
</div>
