{# templates/partials/form_single_methyl.html #}

<div class="section-title">Methylation Target Region</div>

<div class="form-grid">
  <div class="form-row">
    <label for="chrom">Chrom</label>
    <input id="chrom" name="chrom" type="text" placeholder="e.g. chr7" required>
  </div>

  <div class="form-row">
    <label for="start">Start</label>
    <input id="start" name="start" type="number" placeholder="e.g. 55000000" required>
  </div>

  <div class="form-row">
    <label for="end">End</label>
    <input id="end" name="end" type="number" placeholder="e.g. 55000200" required>
  </div>
    <div class="primer-form">
    <div class="form-row">
        <label for="file">Excel 파일 업로드 (.xlsx / .xls)</label>
        <input type="file" name="file" id="file" accept=".xlsx,.xls">
    </div>

    <div class="help-text">
        · 필수 컬럼: <strong>chrom, start, end</strong><br>
        · 선택 컬럼: name, sequence<br>
        · Reference가 hg19/hg38이면 chrom/start/end 기준으로 자동으로 서열을 불러옵니다.
    </div>
</div>

<div class="hint">
  입력한 구간(chrom/start/end)을 기반으로 qPCR primer 디자인을 수행합니다.
</div>
