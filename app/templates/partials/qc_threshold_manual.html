<!-- Toggle Button -->
<button type="button"
        class="toggle-btn"
        data-toggle="qc-panel"
        data-label="QC Thresholds">
  QC Thresholds ▼
</button>

<!-- QC Threshold Panel -->
<div id="qc-panel" class="primer-panel hidden">

  <div class="section-header">
    <div class="section-title">QC Threshold Settings</div>
    <div class="section-desc">
      Primer3 기반 Thermodynamic QC 필터 기준값을 조정할 수 있습니다.
    </div>
  </div>

  <div class="primer-form">
    <!-- Hairpin -->
    <div class="sub-section">
      <div class="sub-section-title">Hairpin</div>
      <div class="form-row">
        <label for="hairpin_min_dg">Min Hairpin ΔG (kcal/mol):</label>
        <input type="number" id="hairpin_min_dg" name="hairpin_min_dg" value="-5.0" step="0.1">
      </div>
    </div>

    <!-- Homodimer -->
    <div class="sub-section">
      <div class="sub-section-title">Homodimer</div>
      <div class="form-row">
        <label for="homodimer_min_dg">Min Homodimer ΔG (kcal/mol):</label>
        <input type="number" id="homodimer_min_dg" name="homodimer_min_dg" value="-6.0" step="0.1">
      </div>
    </div>

    <!-- Heterodimer -->
    <div class="sub-section">
      <div class="sub-section-title">Heterodimer</div>
      <div class="form-row">
        <label for="heterodimer_min_dg">Min Heterodimer ΔG (kcal/mol):</label>
        <input type="number" id="heterodimer_min_dg" name="heterodimer_min_dg" value="-6.0" step="0.1">
      </div>
    </div>

    <!-- Primer-Probe Tm Difference -->
    <div class="sub-section">
      <div class="sub-section-title">Primer–Probe Tm Difference</div>
      <div class="form-row">
        <label for="primer_min_diff_tm">Min Primer Tm Diff (℃):</label>
        <input type="number" id="primer_min_diff_tm" name="primer_min_diff_tm" value="0" step="0.1">
      </div>
      <div class="form-row">
        <label for="primer_max_diff_tm">Max Primer Tm Diff (℃):</label>
        <input type="number" id="primer_max_diff_tm" name="primer_max_diff_tm" value="3" step="0.1">
      </div>
      <div class="form-row">
        <label for="probe_min_diff_tm">Min Probe Tm Diff (℃):</label>
        <input type="number" id="probe_min_diff_tm" name="probe_min_diff_tm" value="5" step="0.1">
      </div>
      <div class="form-row">
        <label for="probe_max_diff_tm">Max Probe Tm Diff (℃):</label>
        <input type="number" id="probe_max_diff_tm" name="probe_max_diff_tm" value="7" step="0.1">
      </div>
    </div>

    <!-- BLAST Filtering -->
    <div class="sub-section">
      <div class="sub-section-title">BLAST Filter Thresholds</div>
      <div class="form-row">
        <label for="blast_identity_threshold">Identity Threshold (%):</label>
        <input type="number" id="blast_identity_threshold" name="blast_identity_threshold"
               value="90.0" step="0.1" min="0" max="100">
      </div>
      <div class="form-row">
        <label for="blast_length_threshold">Min Match Length (nt):</label>
        <input type="number" id="blast_length_threshold" name="blast_length_threshold"
               value="13" min="1" max="500">
      </div>
      <div class="form-row">
        <label for="blast_max_alignments">Max Alignments:</label>
        <input type="number" id="blast_max_alignments" name="blast_max_alignments"
               value="50" min="1" max="10000">
      </div>
    </div>

    <!-- Amplicon Size QC -->
    <div class="sub-section">
      <div class="sub-section-title">Amplicon Size QC</div>
      <div class="form-row">
        <label for="min_amp_bp">Minimum Amplicon Length (bp):</label>
        <input type="number" id="min_amp_bp" name="min_amp_bp" value="50" min="1" max="5000">
      </div>
      <div class="form-row">
        <label for="max_amp_bp">Maximum Amplicon Length (bp):</label>
        <input type="number" id="max_amp_bp" name="max_amp_bp" value="300" min="1" max="10000">
      </div>
    </div>
  </div>
</div>
