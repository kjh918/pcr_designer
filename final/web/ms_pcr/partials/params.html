<div class="panel" id="mspcr-step1-panel">
<div class="section-title">MS-PCR Target Input</div>
<hr class="rule-light">

<div style="margin-bottom:15px;">
<label class="small-label">DESIGN NAME (PROJECT ID)</label>
<input type="text" class="input-tight" id="mspcr-design-name" placeholder="e.g. MGMT_Promoter_Methylation">
</div>

<label class="small-label">RAW SEQUENCE (5' -> 3')</label>
<textarea id="mspcr-raw-sequence" class="input-tight" style="width:100%; height:120px; font-family:monospace; text-transform:uppercase;" placeholder="프로모터 등 타겟 서열(ATGC)을 입력하세요..."></textarea>

<div style="margin-top:15px;">
<label class="small-label">TARGET CpG POSITIONS (1-based, Comma-separated)</label>
<input type="text" class="input-tight" id="mspcr-target-cpgs" placeholder="e.g. 24, 58, 112 (비워두면 서열 내 모든 CG를 타겟으로 간주합니다)">
<small style="color: #666; font-size: 0.8em; display:block; margin-top:4px;">
* 분석하고 싶은 핵심 CpG(메틸화 여부를 판별할 기준점) 인덱스를 쉼표로 구분해 입력하세요.
</small>
</div>

<div style="margin-top: 20px; text-align: right;">
<button class="btn btn-primary" id="btn-convert-bisulfite" style="width: 100%; padding: 10px; font-weight: bold;">
Generate Bisulfite Conversion
</button>
</div>
</div>
