<label class="small-label" style="margin-top:10px;">REFERENCE GENOME</label>
<select class="input-tight" id="input-ref-genome">
<option value="hg38">hg38</option>
<option value="hg19">hg19</option>
</select>

<label class="small-label" style="margin-top:10px;">CHROMOSOME</label>
<input class="input-tight" id="input-chrom" placeholder="e.g. chr17">

<div class="grid-2" style="margin-top:10px;">
<div>
<label class="small-label">START</label>
<input type="number" class="input-tight" id="input-start" placeholder="e.g. 39723640">
</div>
<div>
<label class="small-label">END</label>
<input type="number" class="input-tight" id="input-end" placeholder="e.g. 39723640">
</div>
</div>

<div class="grid-2" style="margin-top:10px;">
<div>
<label class="small-label">REF</label>
<input type="text" class="input-tight" id="input-ref-base" placeholder="e.g. G">
</div>
<div>
<label class="small-label">ALT</label>
<input type="text" class="input-tight" id="input-alt-base" placeholder="e.g. A">
</div>
</div>

<label class="small-label" style="margin-top:10px;">STRAND</label>
<select class="input-tight" id="input-strand">
<option value="+">Plus (+)</option>
<option value="-">Minus (-)</option>
</select>

<label class="small-label" style="margin-top:10px;">MISMATCH</label>
<select class="input-tight" id="input-mismatch">
<option value="None">None</option>
<option value=3>Third bp (3' end)</option>
<option value=2>Second bp (3' end)</option>
</select>

<div class="warn" style="margin-top:8px;">
※ Target-Finder에서 넘겨받은 좌표를 입력하세요. (1-based 기준)
</div>

<hr class="rule">
<div class="section-title">Advanced Parameters</div>
<hr class="rule-light">

<details class="custom-accordion">
<summary>PRIMER OPTIONS</summary>
<div class="accordion-content">

<label class="small-label">AMPLICON SIZE (MIN / MAX)</label>
<div class="grid-2" style="margin-bottom:12px;">
<input type="number" class="input-tight" id="min_amplicon_length" value="80">
<input type="number" class="input-tight" id="max_amplicon_length" value="200">
</div>

<label class="small-label">LENGTH (MIN / OPT / MAX)</label>
<div class="grid-3" style="margin-bottom:12px;">
<input type="number" class="input-tight" id="primer_min_length" value="15">
<input type="number" class="input-tight" id="primer_opt_length" value="18">
<input type="number" class="input-tight" id="primer_max_length" value="25">
</div>

<label class="small-label">TM (MIN / OPT / MAX)</label>
<div class="grid-3" style="margin-bottom:12px;">
<input type="number" class="input-tight" id="primer_min_tm" value="50" step="0.1">
<input type="number" class="input-tight" id="primer_opt_tm" value="55" step="0.1">
<input type="number" class="input-tight" id="primer_max_tm" value="60" step="0.1">
</div>

<label class="small-label">GC% (MIN / OPT / MAX)</label>
<div class="grid-3">
<input type="number" class="input-tight" id="primer_min_gc" value="45">
<input type="number" class="input-tight" id="primer_opt_gc" value="50">
<input type="number" class="input-tight" id="primer_max_gc" value="65">
</div>

</div>
</details>

<details class="custom-accordion">
<summary>QC & SPECIFICITY OPTIONS</summary>
<div class="accordion-content">

<label class="small-label">THERMODYNAMICS (Min dG)</label>
<div class="grid-3" style="margin-bottom:12px;">
<div>
<span style="font-size:0.8em; color:#666;">Hairpin</span>
<input type="number" class="input-tight" id="qc_hairpin_min_dg" value="-5.0" step="0.1">
</div>
<div>
<span style="font-size:0.8em; color:#666;">Homodimer</span>
<input type="number" class="input-tight" id="qc_homodimer_min_dg" value="-6.0" step="0.1">
</div>
<div>
<span style="font-size:0.8em; color:#666;">Heterodimer</span>
<input type="number" class="input-tight" id="qc_heterodimer_min_dg" value="-6.0" step="0.1">
</div>
</div>

<label class="small-label">SPECIFICITY (BLAST)</label>
<div class="grid-3" style="margin-bottom:12px;">
<div>
<span style="font-size:0.8em; color:#666;">Min Identity (%)</span>
<input type="number" class="input-tight" id="qc_min_identity" value="90.0" step="0.1">
</div>
<div>
<span style="font-size:0.8em; color:#666;">Min Hit Length</span>
<input type="number" class="input-tight" id="qc_min_hit_length" value="13">
</div>
<div>
<span style="font-size:0.8em; color:#666;">Max Alignments</span>
<input type="number" class="input-tight" id="qc_blast_max_alignments" value="50">
</div>
</div>

<label class="small-label">AMPLICON QC (Size / Check)</label>
<div class="grid-3" style="margin-bottom:12px;">
<div>
<span style="font-size:0.8em; color:#666;">Min Size</span>
<input type="number" class="input-tight" id="qc_min_amp_size" value="50">
</div>
<div>
<span style="font-size:0.8em; color:#666;">Max Size</span>
<input type="number" class="input-tight" id="qc_max_amp_size" value="300">
</div>
</div>

<label class="small-label">OLIGO CONSTRAINTS (QC Only)</label>
<div class="grid-2" style="margin-bottom:12px;">
<div>
<span style="font-size:0.8em; color:#666;">Primer Max Tm Diff</span>
<input type="number" class="input-tight" id="qc_primer_max_diff_tm" value="3.0" step="0.1">
</div>
</div>

</div>
</details>
