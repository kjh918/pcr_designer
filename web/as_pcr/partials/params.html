<div class="section-title">Target Information</div>
<hr class="rule-light">

<div style="margin-bottom:15px;">
<label class="small-label">DESIGN NAME (PROJECT ID)</label>
<input type="text" class="input-tight" id="input-design-name" placeholder="e.g. PIK3CA_Manual">
</div>

<label class="small-label">RAW SEQUENCE (5' -> 3')</label>
<textarea id="manual-sequence" class="input-tight" style="width:100%; height:120px; font-family:monospace; text-transform:uppercase;" placeholder="ATGC[A,G]ATGC... 서열을 입력하세요."></textarea>

<hr class="rule">
<div class="section-title">Design Parameters</div>
<hr class="rule-light">

<div style="margin-bottom:12px;">
<label class="small-label">REFERENCE GENOME (FOR BLAST QC)</label>
<select id="input-ref-genome" class="input-tight" style="width:100%;">
<option value="hg38">Human (hg38) - Run BLAST</option>
<option value="none" selected>None - Skip BLAST (Fast)</option>
</select>
<small style="color: #666; font-size: 0.8em;">* 'None' 선택 시 비특이 결합 체크를 생략합니다.</small>
</div>

<div class="grid-2" style="gap: 10px; margin-bottom: 2px;">
<div>
<label class="small-label">Target Primer</label>
<select class="input-tight" id="input-strand" style="width: 100%;">
<option value="forward" selected>Forward</option>
<option value="reverse">Reverse</option>
</select>
</div>
<div>
<label class="small-label">Mismatch Intensity</label>
<select class="input-tight" id="input-mismatch-intensity" style="width: 100%;">
<option value="strong" selected>Strong</option>
<option value="medium">Medium</option>
<option value="weak">Weak</option>
</select>
</div>
</div>
<div class="warn" style="font-size: 10px; margin-bottom: 2px;">
※ 변이가 말단에 위치할 Primer와 인위적 Mismatch의 강도를 설정하세요.
</div>

<label class="small-label">MISMATCH POSITION (FROM 3' END)</label>
<select class="input-tight" id="input-mismatch" style="width:100%; margin-bottom: 4px;">
<option value="0">None</option>
<option value="3" selected>3rd bp (Recommended)</option>
<option value="2">2nd bp</option>
<option value="4">4th bp</option>
</select>
<div class="warn" style="font-size: 10px; margin-bottom: 5px;">
※ 3' 말단으로부터 몇 번째 서열에 Mismatch를 삽입할지 선택하세요.
</div>

<hr class="rule">

<details class="custom-accordion">
<summary>PRIMER & AMPLICON OPTIONS</summary>
<div class="accordion-content" style="padding-top: 10px;">
<label class="small-label">AMPLICON SIZE (MIN / MAX)</label>
<div class="grid-2" style="margin-bottom:12px;">
<input type="number" class="input-tight" id="min_amplicon_length" value="80">
<input type="number" class="input-tight" id="max_amplicon_length" value="200">
</div>

<label class="small-label">PRIMER LENGTH (MIN / OPT / MAX)</label>
<div class="grid-3" style="margin-bottom:12px;">
<input type="number" class="input-tight" id="primer_min_length" value="15">
<input type="number" class="input-tight" id="primer_opt_length" value="18">
<input type="number" class="input-tight" id="primer_max_length" value="25">
</div>

<label class="small-label">PRIMER TM (MIN / OPT / MAX)</label>
<div class="grid-3" style="margin-bottom:12px;">
<input type="number" class="input-tight" id="primer_min_tm" value="45" step="0.1">
<input type="number" class="input-tight" id="primer_opt_tm" value="55" step="0.1">
<input type="number" class="input-tight" id="primer_max_tm" value="65" step="0.1">
</div>

<label class="small-label">GC% (MIN / OPT / MAX)</label>
<div class="grid-3">
<input type="number" class="input-tight" id="primer_min_gc" value="25">
<input type="number" class="input-tight" id="primer_opt_gc" value="50">
<input type="number" class="input-tight" id="primer_max_gc" value="85">
</div>
</div>
</details>

<details class="custom-accordion">
<summary>QC & SPECIFICITY OPTIONS</summary>
<div class="accordion-content" style="padding-top: 10px;">
<label class="small-label">THERMODYNAMICS (MIN DG)</label>
<div class="grid-3" style="margin-bottom:12px;">
<div>
<span style="font-size:0.75em; color:#666;">Hairpin</span>
<input type="number" class="input-tight" id="qc_hairpin_min_dg" value="-6.0" step="0.1">
</div>
<div>
<span style="font-size:0.75em; color:#666;">Homo</span>
<input type="number" class="input-tight" id="qc_homodimer_min_dg" value="-6.0" step="0.1">
</div>
<div>
<span style="font-size:0.75em; color:#666;">Hetero</span>
<input type="number" class="input-tight" id="qc_heterodimer_min_dg" value="-6.0" step="0.1">
</div>
</div>

<label class="small-label">BLAST SPECIFICITY</label>
<div class="grid-3" style="margin-bottom:12px;">
<div>
<span style="font-size:0.75em; color:#666;">Min Identity %</span>
<input type="number" class="input-tight" id="qc_min_identity" value="80.0" step="0.1">
</div>
<div>
<span style="font-size:0.75em; color:#666;">Hit Len</span>
<input type="number" class="input-tight" id="qc_min_hit_length" value="10">
</div>
<div>
<span style="font-size:0.75em; color:#666;">Max Alns</span>
<input type="number" class="input-tight" id="qc_blast_max_alignments" value="10">
</div>
</div>

<label class="small-label">QC CONSTRAINTS</label>
<div class="grid-2">
<div>
<span style="font-size:0.75em; color:#666;">Max Tm Diff</span>
<input type="number" class="input-tight" id="qc_primer_max_diff_tm" value="3.0" step="0.1">
</div>
</div>
</div>
</details>
