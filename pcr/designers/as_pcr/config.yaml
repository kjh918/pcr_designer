# pcr/designers/as_pcr/config.yaml
# AS-PCR 전용 기본 설계 및 QC 파라미터

pcr_params:
  primer_kwargs:
    n_candidates: 20
    min_amplicon_length: 60
    max_amplicon_length: 150
    min_length: 15
    opt_length: 22
    max_length: 30
    min_tm: 52.0
    opt_tm: 58.0
    max_tm: 65.0
    min_gc: 35.0
    opt_gc: 50.0
    max_gc: 65.0

qc_criteria:
  # 1. Thermodynamics (열역학 검사)
  hairpin_min_dg: -5.0
  homodimer_min_dg: -6.0
  heterodimer_min_dg: -6.0

  # 2. Specificity (BLAST 검사)
  min_identity: 90.0
  min_identity_threshold: 90.0
  min_hit_length: 13
  blast_max_alignments: 50

  # 3. Amplicon QC
  min_amp_size: 50
  max_amp_size: 300
  use_ispcr_check: false

  # 4. Primer QC
  primer:
    # 🔥 AS-PCR 핵심: Mismatch 도입으로 인해 
    # Wild-type과 Mutant 프라이머 간의 Tm 차이가 벌어지므로 5.0℃ 로 넉넉하게 설정합니다.
    max_diff_tm: 5.0 

  # 5. AS-PCR Specific Settings
  as_pcr:
    check_3_prime_specificity: true  # 3' 말단이 타겟 SNP(변이)에 정확히 위치하는지 검증
    fixed_prime: "forward"           # 타겟 변이를 포함시킬 대상 프라이머 지정 (forward 또는 reverse)
    mismatch_pos: 3                  # 3' 말단으로부터 인위적 mismatch를 도입할 위치 (예: 3은 끝에서 3번째)
    mismatch_intensity: "strong"     # Mismatch 강도 조절 (strong, medium, weak 등)