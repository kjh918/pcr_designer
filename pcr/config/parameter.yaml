references:
  hg19: 
    fasta: /storage/references_and_index/hg19/fasta/cbNIPT/hg19.fa
    blast: /storage/home/jhkim/Apps/ncbi-blast-2.17.0+/ref/h19
  hg38: 
    fasta: /storage/references_and_index/hg38/fasta/cbNIPT/hg38.fa
    blast: /storage/home/jhkim/Apps/ncbi-blast-2.17.0+/ref/hg38

pcr_params:
  primer_kwargs:
    min_amplicon_length: 80
    max_amplicon_length: 120
    n_primers: 100
    opt_length: 25
    min_length: 20
    max_length: 30
    opt_tm: 60
    min_tm: 55
    max_tm: 65
    opt_gc: 45
    min_gc: 25
    max_gc: 85
    primer3_global_args: {}

  bisulfite:
    run: false
    cpg_default: "methyl"

  probe_kwargs:
    n_probes: 100
    min_primer_probe_tm_diff: 6
    max_primer_probe_tm_diff: 8
    opt_length: 25
    min_length: 20
    max_length: 30
    opt_tm: 60
    min_tm: 60
    max_tm: 65
    opt_gc: 50
    min_gc: 35
    max_gc: 65

qc_params:

  # 실행 파일 경로
  BLAST_ROOT: "/storage/home/jhkim/Apps/ncbi-blast-2.17.0+"
  BLAST_BIN_DIR: "/storage/home/jhkim/Apps/ncbi-blast-2.17.0+/bin"
  BLASTN: "/storage/home/jhkim/Apps/ncbi-blast-2.17.0+/bin/blastn"
  BLASTDBCMD: "/storage/home/jhkim/Apps/ncbi-blast-2.17.0+/bin/blastdbcmd"
  BLASTN_DB: /storage/home/jhkim/Apps/ncbi-blast-2.17.0+/ref/hg38

  PRIMER_MAX_DIFF_TM: 3
  PRIMER_MIN_DIFF_TM: 0
  PROBE_MAX_DIFF_TM: 7
  PROBE_MIN_DIFF_TM: 5
  
  HAIRPIN_MIN_DG: -5.0   # hairpin_min_dg
  HOMODIMER_MIN_DG: -6.0   # homodimer_min_dg
  HETERODIMER_MIN_DG: -6.0   # heterodimer_min_dg

  # BLAST 필터 기준
  BLAST_IDENTITY_THRESHOLD: 90.0   # %
  BLAST_LENGTH_THRESHOLD: 10       # 최소 매칭 길이 (nt)
  BLAST_MAX_ALIGNMENTS: 50        # 최대 리포트 align 수  
  MIN_AMP_BP: 50
  MAX_AMP_BP: 300